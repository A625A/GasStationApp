name: Capture portfolio screenshots

on:
  push:
    paths:
      - ".github/workflows/capture-portfolio-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frontend, backend, and browser
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start FastAPI backend
        run: |
          mkdir -p backend/data
          (
            cd backend
            uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/gasstation-backend.log 2>&1 &
            echo $! > /tmp/gasstation-backend.pid
          )
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("FastAPI backend did not start")
          PY

      - name: Create synthetic demo account through the real API
        run: |
          python3 - <<'PY'
          import json, urllib.request
          payload = json.dumps({
              "email": "portfolio@example.com",
              "username": "Andrew",
              "password": "Portfolio123!"
          }).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:8000/api/register",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              print(response.read().decode())
          PY

      - name: Export Expo web app
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npx expo export --platform web --output-dir dist

      - name: Serve exported app
        run: |
          python3 -m http.server 8081 --directory dist > /tmp/gasstationapp.log 2>&1 &
          echo $! > /tmp/gasstationapp.pid
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8081/", timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Expo web export did not start")
          PY

      - name: Capture every application screen
        run: |
          mkdir -p assets/screenshots
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const root = 'http://127.0.0.1:8081/';
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport: { width: 430, height: 900 },
              deviceScaleFactor: 1
            });
            const page = await context.newPage();

            // Login
            await page.goto(root, { waitUntil: 'networkidle' });
            await page.getByText('Hola de nuevo', { exact: true }).waitFor();
            await page.screenshot({
              path: 'assets/screenshots/fuel-rewards-login.png',
              fullPage: true
            });

            // Registration
            await page.getByText('Crear cuenta', { exact: true }).click();
            await page.getByText('Crea tu cuenta', { exact: true }).waitFor();
            await page.screenshot({
              path: 'assets/screenshots/fuel-rewards-register.png',
              fullPage: true
            });

            // Return to a fresh login state and authenticate through the real FastAPI backend.
            await page.goto(root, { waitUntil: 'networkidle' });
            await page.getByText('Hola de nuevo', { exact: true }).waitFor();
            const inputs = page.locator('input');
            await inputs.nth(0).fill('portfolio@example.com');
            await inputs.nth(1).fill('Portfolio123!');
            await page.getByText('Ingresar', { exact: true }).click();
            await page.getByText('Bienvenido, Andrew', { exact: true }).waitFor({ timeout: 15000 });
            await page.waitForTimeout(400);

            // Home
            await page.screenshot({
              path: 'assets/screenshots/fuel-rewards-home.png',
              fullPage: true
            });

            // Promotions
            await page.getByText('Ver promociones', { exact: true }).click();
            await page.getByText('Tus puntos:', { exact: false }).waitFor();
            await page.screenshot({
              path: 'assets/screenshots/fuel-rewards-promotions.png',
              fullPage: true
            });

            // Back to Home through the real bottom-tab navigation.
            await page.getByText('Shell Rewards', { exact: true }).last().click();
            await page.getByText('Bienvenido, Andrew', { exact: true }).waitFor();

            // Coupon exchange
            await page.getByText('Canjear cupones', { exact: true }).click();
            await page.getByText('Canje de cupones', { exact: true }).first().waitFor();
            await page.screenshot({
              path: 'assets/screenshots/fuel-rewards-coupons.png',
              fullPage: true
            });

            // Back to Home, then open Settings from the header gear.
            await page.getByText('Shell Rewards', { exact: true }).last().click();
            await page.getByText('Bienvenido, Andrew', { exact: true }).waitFor();
            await page.mouse.click(412, 32);
            await page.getByText('Configuración de cuenta', { exact: true }).waitFor({ timeout: 10000 });
            await page.screenshot({
              path: 'assets/screenshots/fuel-rewards-settings.png',
              fullPage: true
            });

            await browser.close();
          })();
          JS

      - name: Restore dependency manifests
        run: git checkout -- package.json package-lock.json

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/fuel-rewards-*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "docs: capture all Fuel Rewards screens"
            git push
          fi
